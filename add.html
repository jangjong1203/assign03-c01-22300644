<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="my.css" rel="stylesheet">
    <script>
        function validateForm(event) {
            event.preventDefault();
            const empId = document.getElementById('empId').value;
            const name = document.getElementById('name').value;
            const dept = document.getElementById('dept').value;
            const email = document.getElementById('email').value;

            if (name.trim() === "") { alert("이름을 입력해주세요."); return false; }
            if (empId.length !== 6) { alert("사번은 6자리 숫자로 입력해주세요."); return false; }
            if (dept === "") { alert("부서를 선택해주세요."); return false; }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email !== "" && !emailRegex.test(email)) { alert("유효한 이메일 형식이 아닙니다."); return false; }

            alert("게시물이 추가됩니다.");
            location.href = 'index.html'; 
        }
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">직원 관리 시스템</a>
        </div>
    </nav>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card custom-card">
                    <div class="card-header custom-card-header">
                        신규 직원 등록
                    </div>
                    <div class="card-body p-4">
                        <form onsubmit="validateForm(event)">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">사번 <span class="text-danger">*</span></label>
                                    <input type="number" id="empId" class="form-control" placeholder="6자리 숫자">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">이름 <span class="text-danger">*</span></label>
                                    <input type="text" id="name" class="form-control" placeholder="직원 이름">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">부서 <span class="text-danger">*</span></label>
                                    <select id="dept" class="form-select">
                                        <option value="">부서 선택</option>
                                        <option value="개발팀">개발팀</option>
                                        <option value="디자인팀">디자인팀</option>
                                        <option value="영업팀">영업팀</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">이메일</label>
                                    <input type="email" id="email" class="form-control" placeholder="example@company.com">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">연락처</label>
                                    <input type="text" id="phone" class="form-control" placeholder="010-0000-0000">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">입사일</label>
                                    <input type="date" id="hireDate" class="form-control">
                                </div>
                            </div>
                            <hr class="my-4">
                            <div class="d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">취소</button>
                                <button type="submit" class="btn btn-primary">등록 완료</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
